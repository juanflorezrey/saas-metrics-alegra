<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaaS Metrics · Tablero ejecutivo</title>
<meta name="description" content="Mockup interactivo de las 5 páginas del tablero Power BI de métricas SaaS (datos sintéticos).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens de marca (alegra.com: primary #30ABA9, navy #0F172A, slate) ---------- */
:root{
  color-scheme: light;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#F8FAFC;
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --faint:#94A3B8;
  --line:#E2E8F0; --grid:#EDF1F5; --axis:#CBD5E1;
  --brand:#30ABA9; --brand-ink:#1A7E7F; --brand-50:#EAFAFA; --brand-100:#CFF2F1; --brand-200:#B6ECE9; --brand-deep:#0D4645;
  --s1:#1F9E9C; --s2:#EB6834;
  --g1:#1F9E9C; --g2:#72D5D1; --g3:#0D4645;
  --l1:#E34948; --l2:#F2A09F;
  --total:#475569; --adj:#94A3B8;
  --good:#0CA30C; --good-ink:#067647; --warn:#FAB219; --serious:#EC835A; --crit:#D03B3B; --crit-ink:#B42318;
  --wash:rgba(48,171,169,.10); --hover:rgba(15,23,42,.05);
  --heat-neg:#E34948; --heat-mid:#F1F5F9; --heat-pos:#1F9E9C;
  --mix-1:#72D5D1; --mix-2:#30ABA9; --mix-3:#0D4645;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 12px 32px -16px rgba(48,171,169,.28);
  --logo-chip:transparent;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0B1220; --surface:#131C2E; --surface-2:#1A2438;
    --ink:#F1F5F9; --ink-2:#CBD5E1; --muted:#94A3B8; --faint:#64748B;
    --line:#243047; --grid:#1C2639; --axis:#334155;
    --brand:#30ABA9; --brand-ink:#72D5D1; --brand-50:#0F2A2E; --brand-100:#123B3C; --brand-200:#18504F; --brand-deep:#CFF2F1;
    --s1:#1F9E9C; --s2:#E0662F;
    --g1:#1F9E9C; --g2:#72D5D1; --g3:#CFF2F1;
    --l1:#E66767; --l2:#F4B4B4;
    --total:#94A3B8; --adj:#64748B;
    --good-ink:#4ADE80; --crit-ink:#F87171;
    --wash:rgba(48,171,169,.16); --hover:rgba(255,255,255,.05);
    --heat-neg:#E66767; --heat-mid:#1E293B; --heat-pos:#1F9E9C;
    --mix-1:#CFF2F1; --mix-2:#30ABA9; --mix-3:#18504F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.6);
    --logo-chip:#FFFFFF;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B1220; --surface:#131C2E; --surface-2:#1A2438;
  --ink:#F1F5F9; --ink-2:#CBD5E1; --muted:#94A3B8; --faint:#64748B;
  --line:#243047; --grid:#1C2639; --axis:#334155;
  --brand:#30ABA9; --brand-ink:#72D5D1; --brand-50:#0F2A2E; --brand-100:#123B3C; --brand-200:#18504F; --brand-deep:#CFF2F1;
  --s1:#1F9E9C; --s2:#E0662F;
  --g1:#1F9E9C; --g2:#72D5D1; --g3:#CFF2F1;
  --l1:#E66767; --l2:#F4B4B4;
  --total:#94A3B8; --adj:#64748B;
  --good-ink:#4ADE80; --crit-ink:#F87171;
  --wash:rgba(48,171,169,.16); --hover:rgba(255,255,255,.05);
  --heat-neg:#E66767; --heat-mid:#1E293B; --heat-pos:#1F9E9C;
  --mix-1:#CFF2F1; --mix-2:#30ABA9; --mix-3:#18504F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.6);
  --logo-chip:#FFFFFF;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}

/* ---------- Encabezado ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo-chip{background:var(--logo-chip);border-radius:10px;padding:4px 8px;display:flex;align-items:center}
.logo-chip img{height:30px;width:auto;display:block}
.wordmark{font-weight:700;font-size:24px;letter-spacing:-.02em;color:var(--brand)}
.brand .sep{width:1px;height:32px;background:var(--line)}
.product{font-weight:700;font-size:16px;letter-spacing:-.01em}
.product-sub{color:var(--muted);font-size:12.5px}
.top-actions{display:flex;align-items:center;gap:10px}
.badge-mock{font-size:12px;font-weight:600;color:var(--brand-ink);background:var(--brand-50);border:1px solid var(--brand-200);padding:4px 10px;border-radius:999px;white-space:nowrap}
.btn-icon{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:34px;padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2);font-size:13px}
.btn-icon:hover{background:var(--hover)}

/* ---------- Pestañas ---------- */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:14px 14px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
.tab .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:11px;font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}
.tab[aria-selected="true"] .n{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- Barra de filtros (global, una sola fila sobre los gráficos) ---------- */
.filterbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.filterbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-top:12px;padding-bottom:12px}
.fgroup{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.flabel{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.seg button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.months{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.months button{border:0;background:none;min-width:38px;padding:5px 0;border-radius:8px;font-size:12px;color:var(--muted);cursor:pointer}
.months button:hover{background:var(--hover);color:var(--ink)}
.months button.in{background:var(--brand-100);color:var(--ink);font-weight:600}
.months button.edge{background:var(--brand);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand-50);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.chip.on::before{content:"✓ "}
.factive{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.factive b{color:var(--ink);font-weight:600}
.btn-link{border:0;background:none;color:var(--brand-ink);font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}
.btn-link:hover{background:var(--brand-50)}
.hint{font-size:11.5px;color:var(--faint)}

/* ---------- Páginas y rejilla ---------- */
main{padding:22px 0 8px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:700}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:760px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span-2{grid-column:span 2}
.span-all{grid-column:1/-1}
@media (max-width:1100px){ .g5{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){ .g3,.g2{grid-template-columns:minmax(0,1fr)} .span-2{grid-column:auto} }
@media (max-width:640px){
  .wrap{padding:0 16px}
  .g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .badge-mock{display:none}
  .brand .sep,.product-sub{display:none}
  .factive{margin-left:0}
  .card-h{flex-wrap:wrap}
  .card-tools{flex-wrap:wrap}
  #temaTxt{display:none}
  .card{padding:16px 14px 12px}
  .kpi-val{font-size:24px}
}

/* ---------- Tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 14px;min-width:0;display:flex;flex-direction:column}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card-h h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.card-sub{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.card-tools{display:flex;gap:6px;align-items:center;flex-shrink:0}
.fchip{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.fchip.anual{border-style:solid;background:var(--surface-2)}
.btn-ghost{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.btn-ghost:hover{background:var(--hover)}
.chart-body{position:relative;min-height:60px;flex:1}
.lectura{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--brand-50);color:var(--ink-2);font-size:13px}
.lectura b{color:var(--ink)}
.card-f{margin-top:10px;font-size:11.5px;color:var(--faint)}
.card-f code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--muted)}

/* ---------- KPI ---------- */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 16px 12px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--brand)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.info{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--muted);cursor:help;font-weight:600}
.kpi-val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:10px}
.delta{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.kpi-row svg{flex-shrink:1;min-width:0;max-width:45%}
.delta.good{color:var(--good-ink)} .delta.bad{color:var(--crit-ink)} .delta.flat{color:var(--muted)}
.delta small{font-weight:500;color:var(--muted)}
.kpi-mini .kpi-val{font-size:22px}

/* ---------- Insights ---------- */
.insights{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.insights li{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.ico{flex-shrink:0;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:700}
.ico.up{background:var(--brand-50);color:var(--brand-ink)}
.ico.down{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit-ink)}
.ico.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink)}
.ico.neutral{background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.insights b{font-weight:600}

/* ---------- SVG ---------- */
svg{display:block;overflow:visible}
svg text{font-family:inherit}
.grid-l{stroke:var(--grid);stroke-width:1}
.base-l{stroke:var(--axis);stroke-width:1}
.yl,.xl{fill:var(--muted);font-size:11px}
.xl{font-variant-numeric:tabular-nums}
.xl.out{fill:var(--faint);opacity:.6}
.xl.on{fill:var(--ink);font-weight:600}
.wash{fill:var(--wash)}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:var(--hover)}
.hit:focus{outline:none;fill:var(--hover)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.s1{stroke:var(--s1)} .ln.s2{stroke:var(--s2)}
.area{fill:var(--s1);opacity:.12}
.dot{stroke:var(--surface);stroke-width:2}
.f-s1{fill:var(--s1)} .f-s2{fill:var(--s2)}
.f-g1{fill:var(--g1)} .f-g2{fill:var(--g2)} .f-g3{fill:var(--g3)}
.f-l1{fill:var(--l1)} .f-l2{fill:var(--l2)}
.f-total{fill:var(--total)} .f-adj{fill:var(--adj)}
.f-good{fill:var(--good)} .f-warn{fill:var(--warn)} .f-serious{fill:var(--serious)} .f-crit{fill:var(--crit)} .f-muted{fill:var(--faint)} .f-brand{fill:var(--brand)}
.dim{opacity:.28}
.ref{stroke:var(--ink-2);stroke-width:1}
.ref-t{fill:var(--ink-2);font-size:11px;font-weight:600}
.vl{fill:var(--ink);font-size:11.5px;font-weight:600}
.vl.m{fill:var(--muted);font-weight:500}
.lbl{fill:var(--ink-2);font-size:12px}
.lbl.sel{fill:var(--ink);font-weight:600}
.conn{stroke:var(--axis);stroke-width:1}
.net{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.bar-act{cursor:pointer}
.bar-act:hover{opacity:.85}
.row-hit{fill:transparent;cursor:pointer}
.row-hit:hover{fill:var(--hover)}

/* ---------- Leyenda ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 8px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex-shrink:0}
.sw.s1{background:var(--s1)} .sw.s2{background:var(--s2)}
.sw.g1{background:var(--g1)} .sw.g2{background:var(--g2)} .sw.g3{background:var(--g3)}
.sw.l1{background:var(--l1)} .sw.l2{background:var(--l2)}
.sw.total{background:var(--total)} .sw.adj{background:var(--adj)}
.sw.net{height:2px;width:14px;border-radius:0;background:var(--ink)}
.sw.ref{height:1px;width:14px;border-radius:0;background:var(--ink-2)}
.sw.round{border-radius:999px}

/* ---------- Tooltip ---------- */
.tooltip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px -10px rgba(15,23,42,.35);padding:9px 11px;font-size:12.5px;max-width:300px}
.tooltip b{font-weight:600}
.tooltip .tt-h{font-weight:600;margin-bottom:4px}
.tooltip .tt-r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tooltip .tt-r span:first-child{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tooltip .tt-r span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.tooltip .tt-n{color:var(--muted);margin-top:4px;font-size:11.5px}

/* ---------- Tablas ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.sort{cursor:pointer}
.tbl th.sort:hover{color:var(--ink)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.act{cursor:pointer}
.tbl tbody tr.act:hover{background:var(--hover)}
.tbl tbody tr.sel{background:var(--brand-50)}
.tbl tbody tr.dimr{opacity:.45}
.tbl .muted{color:var(--muted)}
.scroll-y{max-height:420px;overflow-y:auto}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good-ink)}
.badge.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-ink)}
.badge.serious{background:color-mix(in srgb,var(--serious) 18%,transparent);color:var(--ink)}
.badge.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink)}
.badge.neutral{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.badge.muted{background:transparent;border-color:var(--line);color:var(--muted)}

.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;min-width:90px;gap:2px;background:var(--surface)}
.mix i{display:block;height:100%}
.mix-1{background:var(--mix-1)} .mix-2{background:var(--mix-2)} .mix-3{background:var(--mix-3)}
.mix-t{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.mix i.off{opacity:.25}

/* Heatmap de cohortes */
.heat-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.heat th{font-weight:600;color:var(--muted);font-size:11px;padding:4px 6px;text-align:center;white-space:nowrap}
.heat tbody th{text-align:left;color:var(--ink-2);font-size:12px;cursor:pointer;border-radius:6px}
.heat tbody th:hover{background:var(--hover)}
.heat td{text-align:center;padding:7px 2px;border-radius:5px;min-width:40px;cursor:default}
.heat td.n{color:var(--muted);background:transparent}
.heat td.vacio{background:transparent}
.heat tr.sel th{color:var(--brand-ink)}
.heat tr.sel td:not(.n):not(.vacio){box-shadow:inset 0 0 0 2px var(--ink)}
.heat tr.dimr td:not(.n){opacity:.35}
.heat-legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:10px}
.heat-legend .bar{height:8px;width:180px;border-radius:4px;background:linear-gradient(90deg,var(--heat-neg),var(--heat-mid),var(--heat-pos))}

.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;color:var(--ink);width:240px;max-width:100%}
.search:focus{outline:2px solid var(--brand-200);border-color:var(--brand)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.stat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:18px;font-weight:700;letter-spacing:-.01em}

// Columnas mensuales (una serie).

  const mx = Math.max(...o.valores.map(v => v || 0), 1), tk = ticks(0, mx, o.nt || 4), top = tk[tk.length - 1];

    s += `<path class="f-${o.clase || "s1"}${enRango(i) ? "" : " dim"}" d="${barV(f.cx(i) - bw / 2, y(v), bw, y(0))}"/>`; });
  if (o.etiquetaFin) { const v = o.valores[S.h]; if (v) s += `<text class="vl" x="${f.cx(S.h)}" y="${y(v) - 7}" text-anchor="middle">${o.fmtTip(v)}</text>`; }
  s += hits(f, N, i => `<div class="tt-h">${ML[i]} 2024</div>` + tipFila("", o.nombre, o.fmtTip(o.valores[i])) + (o.tipExtra ? o.tipExtra(i) : ""), i => `mes:${i}`);
  return svg(w, h, s, o.nombre);
}

// Barras horizontales (una serie, categorías nominales: un solo tono).
function gBarrasH(w, o) {
  const fila = o.fila || 34, etqW = Math.min(o.etqW || 118, w * .34), valW = o.valW || 92;

  o.items.forEach((it, k) => {
    const yy = k * fila, bh = Math.min(16, fila * .5), by = yy + (fila - bh) / 2;
    const act = it.act ? ` data-act="${it.act}" tabindex="0" role="button"` : "";

    s += `<text class="lbl${it.sel ? " sel" : ""}" x="${x0 - 10}" y="${yy + fila / 2 + 4}" text-anchor="end" pointer-events="none">${esc(it.etq)}</text>`;

    s += `<path class="f-${it.clase || "s1"}${it.dim ? " dim" : ""}" d="${barH(x(0), by, x(it.v), bh)}" pointer-events="none"/>`;
    s += `<text class="vl${it.dim ? " m" : ""}" x="${x(it.v) + 8}" y="${yy + fila / 2 + 4}" pointer-events="none">${esc(it.etqV ?? o.fmt(it.v))}</text>`;
  });
  if (o.ref) s += `<line class="ref" x1="${x(o.ref.v)}" x2="${x(o.ref.v)}" y1="-4" y2="${h - 22}" pointer-events="none"/><text class="ref-t" x="${x(o.ref.v) + 4}" y="-8" pointer-events="none">${esc(o.ref.etq)}</text>`;
  return `<div style="padding-top:${o.ref ? 16 : 0}px">${svg(w, h, s, o.titulo)}</div>`;
}

// Barras horizontales agrupadas (dos series).
function gBarrasH2(w, o) {
  const fila = o.fila || 44, etqW = Math.min(o.etqW || 118, w * .34), valW = o.valW || 70;

    s += `<path class="f-${o.series[1].clase}${dim}" d="${barH(x(0), yb, x(it.b || 0), bh, 3)}" pointer-events="none"/>`;

// KPI con delta mensual y sparkline de 12 meses (rango resaltado).
function kpi(o) {
  const v = o.valor, p = o.previo;

    const bueno = o.mayorEsMejor ? dif > 0 : dif < 0, cls = Math.abs(dif) < 0.005 ? "flat" : bueno ? "good" : "bad";
    const flecha = dif > 0 ? "▲" : dif < 0 ? "▼" : "■";
    const txt = o.deltaPp ? `${signo(dif)}${dec(Math.abs(dif), o.dec ?? 1)} pp` : o.deltaAbs ? `${signo(v - p)}${num(Math.abs(v - p))}` : `${signo(dif)}${dec(Math.abs(dif), 1)}%`;
    delta = `<span class="delta ${cls}">${flecha} ${txt} <small>vs ${MC[S.h - 1]}</small></span>`;
  }
  const sw = 96, sh = 34, vals = o.serie, ok = vals.filter(x => x != null);
  const mn = Math.min(...ok), mx = Math.max(...ok), sx = i => 3 + i * (sw - 6) / (N - 1), sy = x => sh - 4 - (x - mn) / ((mx - mn) || 1) * (sh - 8);
  let sp = rangoCompleto() ? "" : `<rect class="wash" x="${sx(S.d) - 3}" y="0" width="${sx(S.h) - sx(S.d) + 6}" height="${sh}" rx="4"/>`;
  sp += `<path class="ln s1" style="stroke-width:1.75" d="${linePath(vals.map((x, i) => x == null ? null : [sx(i), sy(x)]))}"/>`;
  if (vals[S.h] != null) sp += `<circle class="dot f-s1" cx="${sx(S.h)}" cy="${sy(vals[S.h])}" r="3.5"/>`;
  return `<div class="kpi">
    <div class="kpi-top"><span class="kpi-label">${o.etq}</span><span class="info" tabindex="0" data-tip="${esc(o.info)}">i</span></div>
    <div class="kpi-val">${o.fmt(v)}</div>
    <div class="kpi-sub">${o.sub}</div>
    <div class="kpi-row">${delta}<svg width="${sw}" height="${sh}" aria-hidden="true">${sp}</svg></div>
  </div>`;
}
const mini = (etq, val, sub, info) => `<div class="kpi kpi-mini"><div class="kpi-top"><span class="kpi-label">${etq}</span>${info ? `<span class="info" tabindex="0" data-tip="${esc(info)}">i</span>` : ""}</div><div class="kpi-val">${val}</div><div class="kpi-sub">${sub}</div></div>`;
const dax = t => `<code>${esc(t)}</code>`;
const infoDax = (def, medida) => `<div class="tt-h">${esc(def)}</div><div class="tt-n">Medida DAX: <b>${esc(medida)}</b></div>`;

// ============================ Página 1 · Resumen ejecutivo ============================
function pagResumen() {
  const col = c => R.map(r => r[c]);

  const kpis = [
    kpi({etq: "MRR", valor: M.estado("mrr_total"), previo: M.previo("mrr_total"), fmt: copC, sub: `${cop(M.estado("mrr_total"))} · ${mesFin}`, serie: col("mrr_total"), mayorEsMejor: true,

    kpi({etq: "ARR", valor: M.estado("arr_total"), previo: M.previo("arr_total"), fmt: copC, sub: `${cop(M.estado("arr_total"))} · MRR × 12`, serie: col("arr_total"), mayorEsMejor: true,
      info: infoDax("Ingreso recurrente anualizado al cierre del periodo.", "[ARR] = CALCULATE(SUM(arr_total), LASTNONBLANK(id_periodo, 1))")}),
    kpi({etq: "Clientes activos", valor: M.estado("clientes_activos"), previo: M.previo("clientes_activos"), fmt: num, sub: `Con suscripción vigente · ${mesFin}`, serie: col("clientes_activos"), mayorEsMejor: true, deltaAbs: true,
      info: infoDax("Clientes con MRR mayor a cero al cierre del periodo.", "[Clientes Activos] = CALCULATE(SUM(clientes_activos), LASTNONBLANK(id_periodo, 1))")}),
    kpi({etq: "NRR", valor: M.estado("nrr_pct"), previo: M.previo("nrr_pct"), fmt: v => pct(v, 1), sub: "Retención neta de ingreso · meta ≥ 100%", serie: col("nrr_pct"), mayorEsMejor: true, deltaPp: true,
      info: infoDax("MRR de los clientes existentes al cierre ÷ su MRR al inicio del mes (excluye clientes nuevos).", "[NRR %] = CALCULATE(AVERAGE(nrr_pct), LASTNONBLANK(id_periodo, 1))")}),
    kpi({etq: "Churn de ingreso", valor: M.estado("churn_ingreso_pct"), previo: M.previo("churn_ingreso_pct"), fmt: v => pct(v, 2), sub: `Logos: ${pct(M.estado("churn_logos_pct"), 2)} · mensual`, serie: col("churn_ingreso_pct"), mayorEsMejor: false, deltaPp: true, dec: 2,
      info: infoDax("MRR perdido por bajas ÷ MRR al inicio del mes.", "[Churn Ingreso %] = CALCULATE(AVERAGE(churn_ingreso_pct), LASTNONBLANK(id_periodo, 1))")}),
  ].join("");

  // Lo que hay que saber: frases calculadas con el filtro vigente.
  const ins = [];
  const iIni = S.d === S.h ? S.d - 1 : S.d;
  if (iIni >= 0) {
    const a = R[iIni].mrr_total, b = R[S.h].mrr_total, v = (b - a) / a * 100;
    ins.push([v >= 0 ? "up" : "down", v >= 0 ? "↗" : "↘", `El MRR pasó de <b>${copC(a)}</b> (${MC[iIni]}) a <b>${copC(b)}</b> (${MC[S.h]}): <b>${signo(v)}${dec(Math.abs(v), 1)}%</b>${S.d === 0 && S.h === N - 1 ? `, ${dec(b / a, 1)}x en el año` : ""}.`]);
  }
  let pk = S.d; for (let i = S.d; i <= S.h; i++) if (R[i].mrr_total > R[pk].mrr_total) pk = i;
  if (pk !== S.h) ins.push(["down", "↘", `El pico del periodo fue <b>${ML[pk]}</b> (${copC(R[pk].mrr_total)}). El cierre está <b>${dec((R[S.h].mrr_total - R[pk].mrr_total) / R[pk].mrr_total * -100, 1)}% por debajo</b>.`]);
  const sinNuevo = []; for (let i = Math.max(S.d, 1); i <= S.h; i++) if (!R[i].mrr_nuevo) sinNuevo.push(MC[i]);
  if (sinNuevo.length) ins.push(["warn", "!", `Sin MRR nuevo en <b>${sinNuevo.join(", ")}</b>: es un <b>supuesto de la simulación</b> (no hay altas después de septiembre), no una causa comercial. Sin adquisición, el churn no se compensa.`]);

  const bajo = nrrM.filter(i => R[i].nrr_pct < 100);
  if (nrrM.length) ins.push([bajo.length ? "warn" : "up", bajo.length ? "!" : "✓", `NRR bajo 100% en <b>${bajo.length} de ${nrrM.length}</b> meses${bajo.length ? ` (${bajo.map(i => MC[i]).join(", ")})` : ""}: ${bajo.length > nrrM.length / 2 ? "la base instalada no crece sola" : "la expansión compensa la mayoría de las pérdidas"}.`]);
  let pc = S.d; for (let i = S.d; i <= S.h; i++) if ((R[i].churn_ingreso_pct || 0) > (R[pc].churn_ingreso_pct || 0)) pc = i;
  if (R[pc].churn_ingreso_pct) ins.push(["neutral", "●", `Mayor churn de ingreso: <b>${ML[pc]}</b> con ${pct(R[pc].churn_ingreso_pct, 2)} (${copC(R[pc].mrr_churn)} perdidos).`]);

  CH = {};
  return `
  <div class="page-head"><div><h1>Resumen ejecutivo</h1><p>Estado del negocio al cierre de <b>${ML[S.h]} 2024</b>. Las tarjetas son medidas de estado (último mes del periodo); la variación es contra el mes anterior.</p></div></div>
  <section class="grid g5">${kpis}</section>
  <section class="grid g3">
    ${card({id: "mrr", clase: "span-2", titulo: "MRR mensual", sub: "COP · clic en un mes para filtrar todo el tablero", chips: ["Periodo"], tabla: () => ({cols: [{t: "Mes"}, {t: "MRR (COP)", n: 1}, {t: "Clientes activos", n: 1}], filas: R.map((r, i) => [ML[i], num(r.mrr_total), num(r.clientes_activos)])}),
      dibujo: w => gLinea(w, {titulo: "MRR mensual", series: [{nombre: "MRR", clase: "s1", valores: col("mrr_total")}], area: true, fmtEje: v => corto(v), fmtTip: cop, alto: 270,
        tipExtra: i => tipFila("", "Clientes activos", num(R[i].clientes_activos))}),
      fuente: `Fuente: ${dax("gold_v_resumen_ejecutivo")} · Medida ${dax("[MRR]")}`})}
    ${card({id: "arr", titulo: "ARR mensual", sub: "COP · visual separado del MRR (nunca doble eje)", chips: ["Periodo"], tabla: () => ({cols: [{t: "Mes"}, {t: "ARR (COP)", n: 1}], filas: R.map((r, i) => [ML[i], num(r.arr_total)])}),
      dibujo: w => gLinea(w, {titulo: "ARR mensual", series: [{nombre: "ARR", clase: "s1", valores: col("arr_total")}], fmtEje: v => corto(v), fmtTip: cop, alto: 270}),
      fuente: `Fuente: ${dax("gold_v_resumen_ejecutivo")} · Medida ${dax("[ARR]")}`})}
  </section>
  <section class="grid g3">
    ${card({id: "cli", titulo: "Clientes activos", sub: "Cierre de cada mes", chips: ["Periodo"], tabla: () => ({cols: [{t: "Mes"}, {t: "Clientes activos", n: 1}], filas: R.map((r, i) => [ML[i], num(r.clientes_activos)])}),
      dibujo: w => gColumnas(w, {nombre: "Clientes activos", valores: col("clientes_activos"), fmtEje: num, fmtTip: num, etiquetaFin: true, izq: 40, alto: 230}),

      <ul class="insights">${ins.slice(0, 4).map(([c, i, t]) => `<li><span class="ico ${c}" aria-hidden="true">${i}</span><span>${t}</span></li>`).join("")}</ul>
    </article>
  </section>`;
}

// ============================ Página 2 · MRR Waterfall ============================
const COMP = [
  {c: "mrr_nuevo", n: "Nuevo", k: "g1", s: 1, dax: "[MRR Nuevo]"},
  {c: "mrr_expansion", n: "Expansión", k: "g2", s: 1, dax: "[MRR Expansion]"},
  {c: "mrr_reactivacion", n: "Reactivación", k: "g3", s: 1, dax: "[MRR Reactivacion]"},
  {c: "mrr_contraccion", n: "Contracción", k: "l2", s: -1, dax: "[MRR Contraccion]"},
  {c: "mrr_churn", n: "Churn", k: "l1", s: -1, dax: "[MRR Churn]"},
];
function cascada() {
  const ini = S.d > 0 ? R[S.d - 1].mrr_total : 0, fin = R[S.h].mrr_total;
  const pasos = [{n: "MRR inicio", corto: "Inicio", v: ini, tipo: "total", k: "total"}];
  COMP.forEach(c => pasos.push({n: c.n, corto: c.n.slice(0, 5) + (c.n.length > 6 ? "." : c.n.slice(5)), v: c.s * M.flujo(c.c), tipo: "delta", k: c.k, dax: c.dax}));
  const suma = pasos.reduce((s, p) => s + p.v, 0), ajuste = fin - suma;
  if (Math.abs(ajuste) >= 1) pasos.push({n: "Ajuste de conciliación", corto: "Ajuste", v: ajuste, tipo: "delta", k: "adj"});
  pasos.push({n: "MRR cierre", corto: "Cierre", v: fin, tipo: "total", k: "total"});
  return {pasos, ini, fin, ajuste};
}
function gCascada(w) {
  const {pasos} = cascada(), h = 300, f = marco(w, h, {n: pasos.length, izq: 56, arr: 22});
  let run = 0; const barras = pasos.map(p => { if (p.tipo === "total") { run = p.v; return {p, a: 0, b: p.v}; } const a = run; run += p.v; return {p, a, b: run}; });
  const mx = Math.max(...barras.map(b => Math.max(b.a, b.b)), 1), tk = ticks(0, mx, 4), top = tk[tk.length - 1];
  const y = v => f.y1 - v / top * (f.y1 - f.y0), bw = Math.min(56, f.bw * .58), largo = f.bw >= 84;
  let s = ejeY(f, tk, y, corto);
  barras.forEach((b, i) => {
    const x = f.cx(i) - bw / 2, {p} = b, sube = b.b >= b.a;
    const d = p.tipo === "total" ? barV(x, y(b.b), bw, y(0)) : rectP(x, y(Math.max(b.a, b.b)), bw, y(Math.min(b.a, b.b)));
    if (d) s += `<path class="f-${p.k}" d="${d}"/>`;
    if (i < barras.length - 1) s += `<line class="conn" x1="${x + bw}" x2="${f.cx(i + 1) - bw / 2}" y1="${y(b.b)}" y2="${y(b.b)}"/>`;
    const etq = p.tipo === "total" ? copC(p.v) : (p.v === 0 ? "0" : `${signo(p.v)}${corto(Math.abs(p.v))}`);
    const ty = p.tipo === "total" || sube ? y(Math.max(b.a, b.b)) - 7 : y(Math.min(b.a, b.b)) + 15;
    s += `<text class="vl${p.v === 0 ? " m" : ""}" x="${f.cx(i)}" y="${ty}" text-anchor="middle">${etq}</text>`;
    s += `<text class="xl" x="${f.cx(i)}" y="${h - 8}" text-anchor="middle">${esc(largo ? p.n.replace(" de conciliación", "") : p.corto)}</text>`;

const badgeEstado = e => { const x = ESTADOS[e] || {n: e, cls: "neutral", i: "•"}; return `<span class="badge ${x.cls}">${x.i} ${esc(x.n)}</span>`; };

}

function gConciliacion(w) {
  const h = 230, f = marco(w, h, {izq: 60});
  const dif = R.map(r => r.mrr_total - (D.control_mrr[String(r.id_periodo)] ?? r.mrr_total));
  const tk = ticks(Math.min(0, ...dif), Math.max(0, ...dif), 4), mn = tk[0], mx = tk[tk.length - 1];
  const y = v => f.y1 - (v - mn) / (mx - mn) * (f.y1 - f.y0), bw = Math.min(28, f.bw * .6);
  let s = ejeX(f, MC, true) + ejeY(f, tk, y, v => (v < 0 ? "−" : "") + corto(Math.abs(v)));
  dif.forEach((v, i) => { if (Math.abs(v) < 1) return; s += `<path class="f-${v < 0 ? "l1" : "s1"}${enRango(i) ? "" : " dim"}" d="${barV(f.cx(i) - bw / 2, y(v), bw, y(0))}"/>`; });
  const v = dif[S.h]; if (Math.abs(v) >= 1) s += `<text class="vl" x="${f.cx(S.h)}" y="${v < 0 ? y(v) + 15 : y(v) - 7}" text-anchor="middle">${v < 0 ? "−" : "+"}${corto(Math.abs(v))}</text>`;
  s += hits(f, N, i => `<div class="tt-h">${ML[i]} 2024</div>` + tipFila("", "MRR del pipeline (gold)", cop(R[i].mrr_total)) + tipFila("", "MRR de la verdad de control", cop(D.control_mrr[String(R[i].id_periodo)])) + tipFila("", "Diferencia", `${dif[i] < 0 ? "−" : ""}${cop(Math.abs(dif[i]))}`) + tipFila("", "Diferencia %", pct(dif[i] / D.control_mrr[String(R[i].id_periodo)] * 100, 2)), i => `mes:${i}`);
  return `<div class="legend"><span><i class="sw l1"></i>Pipeline por debajo del control</span><span><i class="sw s1"></i>Por encima</span></div>` + svg(w, h, s, "Conciliación del MRR con la verdad de control");
}

  <div class="page-head"><div><h1>Calidad de datos</h1><p>¿Puedo confiar en estas cifras? Stripe, el CRM y los contratos no comparten un identificador: aquí se ve qué se concilió, qué se resolvió por alias y qué afecta las métricas.</p></div></div>

    ${mini(`Conciliación ${MC[S.h]}`, `${dif < 0 ? "−" : "+"}${cop(Math.abs(dif))}`, `${dif < 0 ? "−" : "+"}${pct(Math.abs(dif / ctl * 100), 2)} vs. la verdad de control`, "MRR del pipeline menos MRR de data/control_totales.json (calculado antes de ensuciar los datos)")}
  </section>
  <section class="grid g2">

      tabla: () => ({cols: [{t: "Estado"}, {t: "Clientes", n: 1}, {t: "MRR inicial", n: 1}], filas: orden.map(e => [ESTADOS[e].n, g(e), num((RC.find(x => x.estado_calidad === e) || {}).mrr_inicial_cop)])}),
      dibujo: w => gBarrasH(w, {titulo: "Clientes por estado", etqW: 170, valW: 56, fmtEje: num, fmt: num,
        items: orden.map(e => ({etq: `${ESTADOS[e].i} ${ESTADOS[e].n}`, v: g(e), clase: ESTADOS[e].f, sel: S.estado === e, dim: S.estado && S.estado !== e, act: `estado:${e}`,

  const extra = [S.plan && `Plan: ${S.plan}`, S.estado && `Estado: ${ESTADOS[S.estado]?.n}`, S.cohorte && `Cohorte: ${COH.find(c => c.id === S.cohorte)?.mes}`].filter(Boolean);
  const hay = !rangoCompleto() || S.canales.size || extra.length;
  $("#factive").innerHTML = `<span><b>${esc(rangoTxt())}</b> · ${esc(canalesTxt())}${extra.length ? " · " + esc(extra.join(" · ")) : ""}</span>${hay ? `<button class="btn-link" type="button" data-act="limpiar:1">Limpiar filtros</button>` : ""}`;
  $("#periodoTxt").textContent = `${rangoTxt()} · ${canalesTxt()}`;
}
function render() {
  renderFiltros();
  $("#pagina").innerHTML = PAGS[S.pag].f();
  dibujar();
  const b = $("#buscar");
  if (b) b.addEventListener("input", e => { S.q = e.target.value; $("#tablaClientes").innerHTML = tablaClientes(); });
  try { history.replaceState(null, "", "#pagina-" + (S.pag + 1)); } catch (e) {}
}
function accion(a, ev) {
  const i = a.indexOf(":"), tipo = a.slice(0, i), val = a.slice(i + 1);
  if (tipo === "pag") { S.pag = +val; render(); window.scrollTo({top: 0}); return; }
  if (tipo === "mes") { const m = +val;
    if (ev && ev.shiftKey) { S.d = Math.min(S.d, m); S.h = Math.max(S.h, m); if (S.d === S.h && S.d !== m) S.h = m; }
    else if (S.d === m && S.h === m) { S.d = 0; S.h = N - 1; } else { S.d = m; S.h = m; } }
  if (tipo === "rango") { const [x, y] = val.split("-").map(Number); S.d = x; S.h = y; }
  if (tipo === "canal") S.canales.has(val) ? S.canales.delete(val) : S.canales.add(val);
  if (tipo === "plan") S.plan = S.plan === val ? null : val;
  if (tipo === "estado") S.estado = S.estado === val ? null : val;
  if (tipo === "cohorte") S.cohorte = S.cohorte === +val ? null : +val;
  if (tipo === "tabla") S.tablas[val] = !S.tablas[val];
  if (tipo === "orden") S.orden = {col: val, dir: S.orden.col === val ? -S.orden.dir : 1};
  if (tipo === "limpiar") { S.d = 0; S.h = N - 1; S.canales.clear(); S.plan = S.estado = S.cohorte = null; }
  const y = window.scrollY; render(); window.scrollTo({top: y});
}
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el) { e.preventDefault(); accion(el.dataset.act, e); } });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act]:not(button)")) { e.preventDefault(); accion(e.target.dataset.act, e); } });

// Tooltip
const tip = $("#tip");
function moverTip(x, y) { const r = tip.getBoundingClientRect(); let l = x + 14, t = y + 14;
  if (l + r.width > innerWidth - 8) l = x - r.width - 14; if (t + r.height > innerHeight - 8) t = y - r.height - 14;
  tip.style.left = Math.max(8, l) + "px"; tip.style.top = Math.max(8, t) + "px"; }
document.addEventListener("pointermove", e => { const el = e.target.closest("[data-tip]");
  if (!el || !el.dataset.tip) { tip.hidden = true; return; }
  if (tip.dataset.src !== el.dataset.tip) { tip.innerHTML = el.dataset.tip; tip.dataset.src = el.dataset.tip; }
  tip.hidden = false; moverTip(e.clientX, e.clientY); });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); if (!el || !el.dataset.tip) return;
  tip.innerHTML = el.dataset.tip; tip.dataset.src = el.dataset.tip; tip.hidden = false; const r = el.getBoundingClientRect(); moverTip(r.left + r.width / 2, r.bottom); });
document.addEventListener("focusout", () => { tip.hidden = true; });
document.addEventListener("scroll", () => { tip.hidden = true; }, {passive: true});

// Tema claro/oscuro
function temaActual() { const t = document.documentElement.dataset.theme; return t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function pintarTema() { $("#temaTxt").textContent = temaActual() === "dark" ? "Oscuro" : "Claro"; }
$("#temaBtn").addEventListener("click", () => { const n = temaActual() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n;
  try { localStorage.setItem("tema", n); } catch (e) {} pintarTema(); render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { pintarTema(); render(); });
try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

// Redibujo al cambiar el ancho
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(dibujar, 120); }).observe($("#pagina"));

// Arranque
const h0 = /#pagina-(\d)/.exec(location.hash); if (h0) S.pag = Math.min(PAGS.length - 1, Math.max(0, +h0[1] - 1));
$("#generado").textContent = D.generado ? `Datos: capa gold exportada · ${D.generado}` : "";
pintarTema();
render();
</script>
</body>
</html>
